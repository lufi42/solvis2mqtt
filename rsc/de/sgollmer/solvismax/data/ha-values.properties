# Text fuer Rohcodes von Kanaelen (UTF-8), Home Assistant zeigt den Text statt der Zahl.
#
# Schluessel: vollstaendiger Kanalname (z.B. Z02.Zustand_HK1) oder nur die Kanal-Id (z.B. Z02).
# Wert: Code=Text, durch Komma getrennt. Unbekannte Codes erscheinen als "Code <n>".
# Ueberschreibbar durch eine gleichnamige Datei im Datenverzeichnis (wie ha-labels.properties).
#
# Codes aus der Analyse der SolvisControl-2-Firmware (MA150) und Messungen an einer Anlage,
# siehe solvis-stack docs/remote-protokoll.md.

# Anforderung an den Waermeerzeuger
Z01=1=keine,2=Warmwasser,3=Heizung

# Zustand der Heizkreise (Betriebsart; 8 = wegen Warmwasser-Vorrang gesperrt)
Z02=2=Timer,3=Tag,4=Nacht,5=Standby,8=Warmwasser-Vorrang
Z03=2=Timer,3=Tag,4=Nacht,5=Standby,8=Warmwasser-Vorrang
Z04=2=Timer,3=Tag,4=Nacht,5=Standby,8=Warmwasser-Vorrang
