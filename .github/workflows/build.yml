name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  jar:
    name: jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: scripts/build-jar.sh

      - name: Smoke test (offline, documentation mode)
        run: |
          mkdir -p smoke/log
          CRYPT=$(java -jar solvis2mqtt.jar --string-to-crypt=test | tail -1)
          sed -e "s|writablePathLinux=\"[^\"]*\"|writablePathLinux=\"$PWD/smoke/log\"|" \
              -e "s|passwordCrypt=\"AES-coded\"|passwordCrypt=\"$CRYPT\"|g" \
              -e "s|<tns:Unit id=|<tns:Unit csvUnit=\"true\" id=|" \
              rsc/de/sgollmer/solvismax/data/base.xml > smoke/base.xml
          java -jar solvis2mqtt.jar --base-xml="$PWD/smoke/base.xml" --channels_of_all_configurations --csvSemicolon
          test -f smoke/log/SolvisServerData/control.xml
          test "$(wc -l < smoke/log/Appendix/SolvisAllChannels.csv)" -gt 100

      - uses: actions/upload-artifact@v5
        with:
          name: solvis2mqtt.jar
          path: solvis2mqtt.jar

      - name: Release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/make-release-zip.sh "${GITHUB_REF_NAME#v}"

      - name: Attach package to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release/*.zip --title "solvis2mqtt $VERSION" --generate-notes
          fi

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (and push from main and tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
